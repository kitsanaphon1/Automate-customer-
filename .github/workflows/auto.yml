name: Build and Push Image

on:
  push:
    branches: [ "Nonprod" ] # รันอัตโนมัติเมื่อมีการ push เข้า branch Nonprod

# 1. แก้ไข Error 403: อนุญาตให้ GitHub Actions เขียนไฟล์กลับเข้า Repo ได้
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. CI Phase: Build และ Push Image ไปที่ Docker Hub
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # ใช้ v1. ตามด้วยเลข run_number เพื่อให้ได้ Version ใหม่เสมอ
          tags: sooyaa1/erpapi-customer:v1.${{ github.run_number }}

      # 3. CD Phase (Automation): แก้ไข Tag ในไฟล์ docker-compose.yaml
      - name: Update Docker Compose Tag
        run: |
          # ค้นหาชื่อ image เดิมและแทนที่ด้วย Tag ใหม่ที่เพิ่ง Build เสร็จ
          sed -i "s|image: sooyaa1/erpapi-customer:.*|image: sooyaa1/erpapi-customer:v1.${{ github.run_number }}|g" docker-compose.yaml
          
      # 4. GitOps: Commit และ Push ไฟล์ที่อัปเดตแล้วกลับเข้า GitHub
      - name: Commit & Push changes
        run: |
          git config --global user.name 'github-bot'
          git config --global user.email 'github-bot@users.noreply.github.com'
          git add docker-compose.yaml
          git commit -m "chore: update erpapi-customer image to v1.${{ github.run_number }}"
          git push