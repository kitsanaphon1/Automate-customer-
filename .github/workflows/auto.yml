name: Build and Push Image

on:
  push:
    branches: [ "Nonprod" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. CI Phase: Build และ Push Image (v1.8, v1.9, ...)
      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: sooyaa1/erpapi-customer:v1.${{ github.run_number }}

      # 2. ป้องกันปัญหา Pull ก่อน Push เสร็จ: รอให้ Image กระจายตัวใน Docker Hub สักครู่
      - name: Wait for Image propagation
        run: sleep 15

      # 3. CD Phase: อัปเดตไฟล์ใน Deploy Repo (GitOps)
      - name: Update Deploy Repo Tag
        if: success() # บังคับรันเฉพาะเมื่อ Build สำเร็จเท่านั้น
        run: |
          # Clone เฉพาะ Branch Nonprod มาทำงาน
          git clone -b Nonprod https://${{ secrets.OPS_REPO_TOKEN }}@github.com/kitsanaphon1/deploy-customer-api.git
          cd deploy-customer-api
          
          # ใช้คำสั่ง sed ที่แม่นยำเพื่อเปลี่ยนเลขเวอร์ชันให้ตรงกับ Run Number ล่าสุด
          sed -i "s|image: sooyaa1/erpapi-customer:.*|image: sooyaa1/erpapi-customer:v1.${{ github.run_number }}|g" docker-compose.yaml
          
          # ตั้งค่า Git User
          git config --global user.name 'github-bot'
          git config --global user.email 'github-bot@users.noreply.github.com'
          
          # บันทึกและส่งการเปลี่ยนแปลงกลับไปที่ GitHub (Branch Nonprod)
          git add docker-compose.yaml
          git commit -m "chore: update image to v1.${{ github.run_number }} (confirmed build)"
          git push https://${{ secrets.OPS_REPO_TOKEN }}@github.com/kitsanaphon1/deploy-customer-api.git Nonprod