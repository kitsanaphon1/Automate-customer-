name: Build and Push Image

on:
  push:
    branches: [ "Nonprod" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. CI Phase: Build และ Push Image (ทำสำเร็จแล้วใน v1.4)
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Image จะถูกเก็บไว้ที่ Docker Hub พร้อมเลข Run Number เสมอ
          tags: sooyaa1/erpapi-customer:v1.${{ github.run_number }}

      # ส่วนที่เหลือ (Update & Commit) ถูกถอดออก 
      # เพื่อป้องกัน Error: No such file or directory