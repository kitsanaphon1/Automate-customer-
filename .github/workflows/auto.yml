name: Build and Push Image

on:
  push:
    branches: [ "Nonprod" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. CI Phase: Build และ Push Image
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: sooyaa1/erpapi-customer:v1.${{ github.run_number }}

      # 2. CD Phase: ส่งเลข Tag ไปอัปเดตที่ Deploy Repo (GitOps)
      - name: Update Deploy Repo Tag
        run: |
          # Clone เฉพาะ Repo ปลายทางลงมา
          git clone https://${{ secrets.OPS_REPO_TOKEN }}@github.com/kitsanaphon1/deploy-customer-api.git Nonprod
          cd deploy-customer-api
          
          # แก้ไขไฟล์ docker-compose.yaml ด้วยเลข Version ล่าสุด (v1.x)
          # หมายเหตุ: ตรวจสอบว่าชื่อ Image ใน docker-compose.yaml ตรงกับที่ส่งไป (sooyaa1/erpapi-customer)
          sed -i "s|image: sooyaa1/erpapi-customer:.*|image: sooyaa1/erpapi-customer:v1.${{ github.run_number }}|g" docker-compose.yaml
          
          # ตั้งค่า Git และส่งการเปลี่ยนแปลงกลับไปที่ GitHub
          git config --global user.name 'github-bot'
          git config --global user.email 'github-bot@users.noreply.github.com'
          git add docker-compose.yaml
          git commit -m "chore: update image version to v1.${{ github.run_number }}"
          git push